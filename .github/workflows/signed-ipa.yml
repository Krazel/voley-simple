name: Prepare signed TestFlight IPA
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: voley-signed-ipa
  cancel-in-progress: false
jobs:
  export:
    if: github.actor == github.repository_owner && github.ref == 'refs/heads/main' && !github.event.repository.private
    runs-on: macos-latest
    environment: app-store-production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.js
      - run: node scripts/build-standalone.mjs && node scripts/prepare-ios.mjs
      - run: brew install xcodegen && cd ios && xcodegen generate
      - name: Sign, export and validate without uploading
        env:
          VOLEY_NATIVE_EXPORT: 'true'
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_APP_STORE_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROFILE_BASE64 }}
        run: node scripts/export-testflight-ipa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VoleySimple-0.18-1-signed-candidate-${{ github.sha }}
          path: artifacts/testflight/
          retention-days: 3
