name: VoleySimple
options:
  bundleIdPrefix: com.krazel
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    MARKETING_VERSION: "0.21"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  VoleySimple:
    type: application
    platform: iOS
    sources:
      - App
      - path: Web
        type: folder
        buildPhase: resources
      - path: Audio
        type: folder
        buildPhase: resources
      - path: Assets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.krazel.voleysimple
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  VoleySimple:
    build:
      targets:
        VoleySimple: all
